name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, Postgres, evaluation gates)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: sovereign
          POSTGRES_PASSWORD: sovereign
          POSTGRES_DB: sovereign_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sovereign -d sovereign_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://sovereign:sovereign@localhost:5432/sovereign_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (incl. PostgreSQL-specific and evaluation gates)
        run: pytest -q -ra
      - name: Evaluation report
        if: always()
        run: python -m evaluation run --out evaluation/reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation/reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images & Helm chart
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/docker/api.Dockerfile -t sovereign-api:${{ github.sha }} .
      - name: Build web image
        run: docker build -f deploy/docker/web.Dockerfile -t sovereign-web:${{ github.sha }} .
      - name: Validate compose file
        run: docker compose --profile ai --profile monitoring config --quiet
      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/sovereign
          helm template ci deploy/helm/sovereign \
            --set ingress.enabled=true --set ingress.tls.enabled=true \
            --set api.autoscaling.enabled=true --set metrics.serviceMonitor.enabled=true > /dev/null
