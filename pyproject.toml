[project]
name = "sovereign-enterprise-ai"
version = "0.1.0"
description = "Local enterprise Agentic AI orchestration and management platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "langgraph",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]