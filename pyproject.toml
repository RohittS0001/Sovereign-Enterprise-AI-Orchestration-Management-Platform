[project]
name = "sovereign-enterprise-ai"
version = "0.1.0"
description = "Local enterprise Agentic AI orchestration and management platform"
requires-python = ">=3.13"
# Ranges here; exact pins for reproducible installs live in requirements.txt.
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28,<1",
    "redis>=5.2,<6",
    "langgraph>=1.2,<2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy[asyncio]>=2.1,<3",
    "aiosqlite>=0.22,<1",
    "pyjwt>=2.15,<3",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.3,<3",
    "python-multipart>=0.0.33",
    "pgvector>=0.5,<1",
    "pypdf>=7.0,<8",
    "python-docx>=1.2,<2",
    "pyyaml>=6.0,<7",
    "prometheus-client>=0.26,<1",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "google-api-python-client>=2.201,<3",
    "google-auth>=2.61,<3",
    "google-auth-httplib2>=0.4,<1",
    "google-auth-oauthlib>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = [
    "B008",  # FastAPI dependency defaults
]

[tool.ruff.lint.per-file-ignores]
# Long literals in test fixtures and evaluation metric tables read better unwrapped.
"evaluation/suites/**" = ["E501"]
"tests/**" = ["S101", "S105", "S106", "S107", "E731", "E501"]
"scripts/**" = ["T201", "S603", "S607"]  # dev tooling runs fixed commands
# Regex patterns read better unwrapped.
"backend/app/domains/governance/guardrails/injection.py" = ["E501"]
"backend/app/integrations/connectors/*" = ["E501"]  # compact declarative specs
"backend/app/tools/connectors.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "evaluation", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real external services; skipped unless --run-live or RUN_LIVE_TESTS=1",
    "postgres: needs TEST_POSTGRES_URL (a disposable PostgreSQL + pgvector database)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["backend/app", "evaluation"]
# SQLAlchemy's async engine switches greenlets; without this, lines after awaits look untested.
concurrency = ["thread", "greenlet"]
omit = ["backend/migrations/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
