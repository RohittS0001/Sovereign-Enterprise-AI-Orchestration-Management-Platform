# Knowledge-base retrieval over the demo documents.
# relevant: passages a good result returns (title + text in the section path). A result in the
#   exact section scores gain 2; another section of a relevant document scores gain 1.
# forbidden: documents this role must never receive (access-control leak test).
# Queries mix near-verbatim wording, paraphrases with little word overlap, and multi-part
# questions with more than one relevant section (so recall@k differs from hit rate).
k: 3
thresholds:
  hit_at_1: 0.7
  hit_at_k: 0.9
  recall_at_k: 0.8
  mrr: 0.75
  ndcg_at_k: 0.7
  context_precision_at_k: 0.7
  latency_p95_ms: 500
  fusion_gain_mrr: -0.01   # hybrid may never trail the best single retriever
  leak_rate: 0.0

queries:
  - id: vendor-no-fix-date
    role: member
    query: What should we do if the vendor gives no fix date?
    relevant: [{title: Incident Escalation Policy, section: Vendor incidents}]
  - id: vendor-escalation-who
    role: team_lead
    query: who escalates to the vendor account manager
    relevant: [{title: Incident Escalation Policy, section: Vendor incidents}]
  - id: sev1-definition
    role: member
    query: When is an incident SEV1 and who gets paged?
    relevant: [{title: Incident Escalation Policy, section: Severity levels}]
  - id: degraded-payments-severity
    role: member
    query: severity for elevated timeouts above 2 percent
    relevant: [{title: Incident Escalation Policy, section: Severity levels}]
  - id: customer-updates
    role: member
    query: Who sends customer-facing status updates during an incident?
    relevant: [{title: Incident Escalation Policy, section: Communication}]
  - id: definition-of-done
    role: member
    query: what is the definition of done for a story
    relevant: [{title: Release Process, section: Definition of done}]
  - id: release-freeze
    role: team_lead
    query: Can we release right before a big merchant sale?
    relevant: [{title: Release Process, section: Release freeze}]
  - id: failing-main-builds
    role: member
    query: what happens after two failing builds on main
    relevant: [{title: Release Process, section: CI requirements}]
  - id: sprint-commitment
    role: project_manager
    query: how much of our velocity should a sprint commit to
    relevant: [{title: Release Process, section: Sprint commitments}]
  - id: unplanned-leave
    role: project_manager
    query: unplanned leave above 20 percent of team capacity
    relevant: [{title: Release Process, section: Sprint commitments}]
  - id: sla-penalty-pm
    role: project_manager
    query: service credit for an SLA breach
    relevant: [{title: Gateway Vendor Contract Summary, section: Penalties}]
  - id: vendor-availability-pm
    role: project_manager
    query: what availability does the gateway vendor guarantee
    relevant: [{title: Gateway Vendor Contract Summary, section: Service levels}]
  - id: exit-clause-pm
    role: project_manager
    query: can we terminate the vendor contract after repeated breaches
    relevant: [{title: Gateway Vendor Contract Summary, section: Exit clause}]

  # Paraphrases: the same needs, worded the way people actually ask.
  - id: para-vendor-silent
    role: team_lead
    query: the supplier still has not said when the bug will be fixed, what now
    relevant: [{title: Incident Escalation Policy, section: Vendor incidents}]
  - id: para-who-talks-to-customers
    role: member
    query: can an engineer email merchants directly during an outage
    relevant: [{title: Incident Escalation Policy, section: Communication}]
  - id: para-story-complete
    role: member
    query: when can I move my ticket to done
    relevant: [{title: Release Process, section: Definition of done}]
  - id: para-merge-stop
    role: member
    query: why are merges blocked on main right now
    relevant: [{title: Release Process, section: CI requirements}]
  - id: para-latency-guarantee
    role: project_manager
    query: how fast must the capture API respond under the contract
    relevant: [{title: Gateway Vendor Contract Summary, section: Service levels}]
  - id: para-page-manager
    role: member
    query: payments are failing for customers, who do I wake up
    relevant: [{title: Incident Escalation Policy, section: Severity levels}]

  # Multi-part questions: two relevant sections each.
  - id: multi-vendor-breach
    role: project_manager
    query: the vendor broke the SLA again, what credit do we get and can we leave the contract
    relevant:
      - {title: Gateway Vendor Contract Summary, section: Penalties}
      - {title: Gateway Vendor Contract Summary, section: Exit clause}
  - id: multi-release-rules
    role: team_lead
    query: before a release which CI job must pass and are there freeze periods
    relevant:
      - {title: Release Process, section: CI requirements}
      - {title: Release Process, section: Release freeze}
  - id: multi-sev2-vendor
    role: team_lead
    query: a vendor caused elevated timeouts, which severity is it and who escalates
    relevant:
      - {title: Incident Escalation Policy, section: Severity levels}
      - {title: Incident Escalation Policy, section: Vendor incidents}

  # Access control: restricted contract must never reach these roles.
  - id: leak-member-sla
    role: member
    query: service credit for an SLA breach penalties
    forbidden: [Gateway Vendor Contract Summary]
  - id: leak-lead-exit
    role: team_lead
    query: terminate vendor contract exit clause notice
    forbidden: [Gateway Vendor Contract Summary]
  - id: leak-auditor-availability
    role: auditor
    query: vendor guarantees 99.95% monthly availability
    forbidden: [Gateway Vendor Contract Summary]
