{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sovereign.fullname" . }}
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The web pods serve the UI and proxy /api to the API service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sovereign.fullname" . }}-web
                port: {name: http}
{{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.metrics.serviceMonitor.tokenSecret.key }}
{{- fail "metrics.serviceMonitor needs tokenSecret.key: /metrics must be scraped with METRICS_TOKEN" }}
{{- end }}
{{- $tokenSecret := .Values.metrics.serviceMonitor.tokenSecret.name | default .Values.existingSecret }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sovereign.fullname" . }}-api
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      # /metrics requires METRICS_TOKEN (the API reads it from the same Secret), so
      # Prometheus sends it as a bearer token; the web/Ingress path blocks /metrics anyway.
      authorization:
        type: Bearer
        credentials:
          name: {{ $tokenSecret }}
          key: {{ .Values.metrics.serviceMonitor.tokenSecret.key }}
{{- end }}
