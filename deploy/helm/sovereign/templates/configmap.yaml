apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sovereign.fullname" . }}-config
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  WEB_CONCURRENCY: {{ .Values.api.workersPerPod | quote }}
  RUN_MIGRATIONS: "false"   # the pre-install/pre-upgrade job owns migrations
  SEED_DEMO: "false"
