{{- $component := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sovereign.fullname" . }}-api
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sovereign.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sovereign.selector" $component | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "sovereign.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "sovereign.apiEnv" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.connectionsSecret }}
          volumeMounts:
            - name: connections
              mountPath: /app/connections.env
              subPath: connections.env
              readOnly: true
          {{- end }}
      {{- if .Values.connectionsSecret }}
      volumes:
        - name: connections
          secret:
            secretName: {{ .Values.connectionsSecret }}
            items:
              - key: connections.env
                path: connections.env
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign.fullname" . }}-api
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "sovereign.selector" $component | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sovereign.fullname" . }}-api
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sovereign.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
