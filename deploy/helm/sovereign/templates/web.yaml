{{- $component := dict "root" . "component" "web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sovereign.fullname" . }}-web
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "sovereign.selector" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sovereign.selector" $component | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "sovereign.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API_UPSTREAM
              value: {{ printf "%s-api:8000" (include "sovereign.fullname" .) | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovereign.fullname" . }}-web
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "sovereign.selector" $component | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
